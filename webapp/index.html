<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Hisobchi Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/webapp/styles.css?v=1" />
  <script src="/webapp/app.js?v=1" defer></script>
</head>
<body>
  <div id="app-shell">
    <header class="topbar" id="topbar">
      <div class="topbar-brand">
        <div class="brand-logo" aria-hidden="true">H</div>
        <div>
          <div class="brand-title">Hisobchi</div>
          <div class="brand-sub" id="topbar-sub">Kassa va nakladnoy</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-theme" type="button" title="Mavzu" aria-label="Mavzuni almashtirish">🌙</button>
        <button class="icon-btn" id="btn-refresh" type="button" title="Yangilash" aria-label="Yangilash">↻</button>
      </div>
    </header>

    <main id="app-root" class="app-root">
      <div class="card skeleton-card">
        <div class="skeleton-line w-60"></div>
        <div class="skeleton-line w-40"></div>
        <div class="skeleton-line w-85"></div>
      </div>
    </main>

    <button id="fab-add" class="fab hidden" type="button">
      <span>+</span>
      <span>Nakladnoy</span>
    </button>

    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Asosiy navigatsiya">
      <button class="nav-btn active" data-tab="dashboard" type="button">
        <span class="nav-ico">📊</span>
        <span class="nav-lbl">Asosiy</span>
      </button>
      <button class="nav-btn" data-tab="nakladnoys" type="button">
        <span class="nav-ico">🧾</span>
        <span class="nav-lbl">Nakladnoy</span>
      </button>
      <button class="nav-btn" data-tab="debts" type="button">
        <span class="nav-ico">📌</span>
        <span class="nav-lbl">Qarzlar</span>
        <span class="nav-badge hidden" id="nav-debt-badge">0</span>
      </button>
      <button class="nav-btn" data-tab="reports" type="button">
        <span class="nav-ico">⚙️</span>
        <span class="nav-lbl">Smena</span>
      </button>
    </nav>
  </div>

  <div id="sheet-overlay" class="sheet-overlay hidden" aria-hidden="true">
    <div id="sheet-box" class="sheet-box" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="sheet-title" class="sheet-title"></h3>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Yopish">✕</button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox hidden">
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Yopish">✕</button>
    <img id="lightbox-img" src="" alt="Nakladnoy rasmi" />
  </div>

  <div id="toast" class="toast hidden"></div>
</body>
</html>
