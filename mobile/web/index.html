<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Hisobchi — Kunlik kassa va nakladnoy tizimi">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisobchi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Hisobchi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      function getTg() {
        return (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
      }

      window.HisobchiWebBridge = {
        init: function () {
          try {
            var tg = getTg();
            if (!tg) return;
            if (typeof tg.ready === 'function') tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') {
              try { tg.disableVerticalSwipes(); } catch (_) {}
            }
          } catch (_) {}
        },
        getInitData: function () {
          try {
            var tg = getTg();
            return (tg && tg.initData) ? String(tg.initData) : '';
          } catch (_) {
            return '';
          }
        },
        getColorScheme: function () {
          try {
            var tg = getTg();
            return (tg && tg.colorScheme) ? String(tg.colorScheme) : '';
          } catch (_) {
            return '';
          }
        },
        syncChromeColors: function (isDark) {
          try {
            var tg = getTg();
            if (!tg) return;
            var bg = isDark ? '#090712' : '#F6F4FB';
            var hdr = isDark ? '#131020' : '#6D28D9';
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(bg);
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor(hdr);
          } catch (_) {}
        },
        tryTelegramDownload: function (url, filename) {
          try {
            var tg = getTg();
            if (tg && typeof tg.downloadFile === 'function') {
              tg.downloadFile({ url: url, file_name: filename });
              return true;
            }
            if (tg && typeof tg.openLink === 'function') {
              tg.openLink(url);
              return true;
            }
          } catch (_) {}
          return false;
        },
        openTelegramLink: function (url) {
          try {
            var tg = getTg();
            if (tg && url && url.indexOf('https://t.me/') === 0 && typeof tg.openTelegramLink === 'function') {
              tg.openTelegramLink(url);
              return true;
            }
            if (tg && typeof tg.openLink === 'function') {
              tg.openLink(url);
              return true;
            }
            window.open(url, '_blank');
            return true;
          } catch (_) {
            return false;
          }
        },
        downloadBlob: function (bytes, filename) {
          var blob = new Blob([bytes], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          var objectUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = objectUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            document.body.removeChild(a);
            URL.revokeObjectURL(objectUrl);
          }, 1200);
        },
        pickFile: function (accept) {
          return new Promise(function (resolve) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = accept || '';
            input.style.display = 'none';
            var settled = false;
            function finish(result) {
              if (settled) return;
              settled = true;
              window.removeEventListener('focus', onFocusBack);
              if (input.parentNode) input.parentNode.removeChild(input);
              resolve(result);
            }
            function onFocusBack() {
              setTimeout(function () {
                if (!settled && (!input.files || input.files.length === 0)) {
                  finish(null);
                }
              }, 600);
            }
            input.onchange = function () {
              var file = input.files && input.files[0];
              if (!file) {
                finish(null);
                return;
              }
              var reader = new FileReader();
              reader.onload = function () {
                finish({
                  name: file.name || 'file',
                  bytes: new Uint8Array(reader.result)
                });
              };
              reader.onerror = function () { finish(null); };
              reader.readAsArrayBuffer(file);
            };
            input.oncancel = function () { finish(null); };
            window.addEventListener('focus', onFocusBack, { once: true });
            document.body.appendChild(input);
            input.click();
          });
        },
        reloadApp: function () {
          try {
            window.location.reload();
          } catch (_) {}
        }
      };

      window.HisobchiWebBridge.init();
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05030F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hisobchi-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(180, 76, 255, 0.28) 0%, rgba(124, 58, 237, 0.10) 34%, transparent 66%),
        radial-gradient(ellipse at 50% 106%, rgba(139, 47, 224, 0.36) 0%, transparent 56%),
        #05030F;
      color: #F8FAFC;
      transition: opacity 0.32s ease;
    }
    #hisobchi-splash::after {
      content: '';
      position: absolute;
      left: -18%;
      right: -18%;
      bottom: -90px;
      height: 130px;
      border-radius: 50% 50% 0 0;
      border-top: 2px solid rgba(245, 208, 254, 0.72);
      box-shadow: 0 -10px 32px rgba(236, 72, 153, 0.55);
      pointer-events: none;
    }
    #hisobchi-splash .logo-wrap {
      position: relative;
      width: 132px;
      height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 520px;
      animation: hbreathe 2.6s ease-in-out infinite;
    }
    #hisobchi-splash .squircle-3d {
      width: 112px;
      height: 112px;
      border-radius: 30px;
      transform: rotateX(14deg) rotateY(-20deg) rotateZ(-6deg);
      background: linear-gradient(135deg, #FCE7F3 0%, #C084FC 24%, #581C87 58%, #DB2777 100%);
      padding: 8px;
      box-sizing: border-box;
      box-shadow:
        -9px 11px 0 #2E1065,
        -12px 14px 26px rgba(168, 85, 247, 0.50),
        0 0 38px rgba(236, 72, 153, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hisobchi-splash .squircle-cavity {
      width: 100%;
      height: 100%;
      border-radius: 23px;
      background: radial-gradient(circle at 40% 38%, #1A0E33 0%, #090514 75%);
      border: 1px solid rgba(249, 168, 212, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #hisobchi-splash .starburst {
      width: 62px;
      height: 62px;
      animation: hspin 2.2s linear infinite;
      filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.75));
    }
    #hisobchi-splash .title {
      margin-top: 22px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.4px;
      color: #FFFFFF;
    }
    #hisobchi-splash .sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.72);
    }
    #hisobchi-splash .bar {
      margin-top: 20px;
      width: 156px;
      height: 4.5px;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.22);
      overflow: hidden;
      position: relative;
    }
    #hisobchi-splash .bar-fill {
      width: 68px;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #A855F7, #F472B6, #FFFFFF);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.65);
      animation: hslide 1.3s ease-in-out infinite alternate;
    }
    @keyframes hspin {
      to { transform: rotate(360deg); }
    }
    @keyframes hbreathe {
      0%, 100% { transform: translateY(0px) scale(0.98); }
      50% { transform: translateY(-4px) scale(1.03); }
    }
    @keyframes hslide {
      from { transform: translateX(0); }
      to { transform: translateX(88px); }
    }
  </style>
</head>
<body>
  <div id="hisobchi-splash">
    <div class="logo-wrap">
      <div class="squircle-3d">
        <div class="squircle-cavity">
          <svg class="starburst" viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">
            <g fill="#F472B6">
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" opacity="1.0" fill="#FFFFFF"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(30)" opacity="0.92" fill="#FCE7F3"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(60)" opacity="0.84" fill="#F9A8D4"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(90)" opacity="0.76"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(120)" opacity="0.68"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(150)" opacity="0.60"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(180)" opacity="0.52" fill="#EC4899"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(210)" opacity="0.46" fill="#D946EF"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(240)" opacity="0.40" fill="#C084FC"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(270)" opacity="0.36" fill="#A855F7"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(300)" opacity="0.55" fill="#EC4899"/>
              <polygon points="-3.5,-19 3.5,-19 5,-42 -5,-42" transform="rotate(330)" opacity="0.78" fill="#F9A8D4"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <div class="title">Hisobchi</div>
    <div class="sub">Ilova tayyorlanmoqda...</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('hisobchi-splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 250);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
