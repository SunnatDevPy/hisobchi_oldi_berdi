<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Hisobchi — Kunlik kassa va nakladnoy tizimi">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hisobchi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Hisobchi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      function getTg() {
        return (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
      }

      window.HisobchiWebBridge = {
        init: function () {
          try {
            var tg = getTg();
            if (!tg) return;
            if (typeof tg.ready === 'function') tg.ready();
            if (typeof tg.expand === 'function') tg.expand();
            if (typeof tg.disableVerticalSwipes === 'function') {
              try { tg.disableVerticalSwipes(); } catch (_) {}
            }
          } catch (_) {}
        },
        getInitData: function () {
          try {
            var tg = getTg();
            return (tg && tg.initData) ? String(tg.initData) : '';
          } catch (_) {
            return '';
          }
        },
        getColorScheme: function () {
          try {
            var tg = getTg();
            return (tg && tg.colorScheme) ? String(tg.colorScheme) : '';
          } catch (_) {
            return '';
          }
        },
        syncChromeColors: function (isDark) {
          try {
            var tg = getTg();
            if (!tg) return;
            var bg = isDark ? '#090D18' : '#F3F5FA';
            var hdr = isDark ? '#13192B' : '#4338CA';
            if (typeof tg.setBackgroundColor === 'function') tg.setBackgroundColor(bg);
            if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor(hdr);
          } catch (_) {}
        },
        tryTelegramDownload: function (url, filename) {
          try {
            var tg = getTg();
            if (tg && typeof tg.downloadFile === 'function') {
              tg.downloadFile({ url: url, file_name: filename });
              return true;
            }
            if (tg && typeof tg.openLink === 'function') {
              tg.openLink(url);
              return true;
            }
          } catch (_) {}
          return false;
        },
        openTelegramLink: function (url) {
          try {
            var tg = getTg();
            if (tg && url && url.indexOf('https://t.me/') === 0 && typeof tg.openTelegramLink === 'function') {
              tg.openTelegramLink(url);
              return true;
            }
            if (tg && typeof tg.openLink === 'function') {
              tg.openLink(url);
              return true;
            }
            window.open(url, '_blank');
            return true;
          } catch (_) {
            return false;
          }
        },
        downloadBlob: function (bytes, filename) {
          var blob = new Blob([bytes], {
            type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
          });
          var objectUrl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = objectUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          setTimeout(function () {
            document.body.removeChild(a);
            URL.revokeObjectURL(objectUrl);
          }, 1200);
        },
        pickFile: function (accept) {
          return new Promise(function (resolve) {
            var input = document.createElement('input');
            input.type = 'file';
            input.accept = accept || '';
            input.style.display = 'none';
            var settled = false;
            function finish(result) {
              if (settled) return;
              settled = true;
              window.removeEventListener('focus', onFocusBack);
              if (input.parentNode) input.parentNode.removeChild(input);
              resolve(result);
            }
            function onFocusBack() {
              setTimeout(function () {
                if (!settled && (!input.files || input.files.length === 0)) {
                  finish(null);
                }
              }, 600);
            }
            input.onchange = function () {
              var file = input.files && input.files[0];
              if (!file) {
                finish(null);
                return;
              }
              var reader = new FileReader();
              reader.onload = function () {
                finish({
                  name: file.name || 'file',
                  bytes: new Uint8Array(reader.result)
                });
              };
              reader.onerror = function () { finish(null); };
              reader.readAsArrayBuffer(file);
            };
            input.oncancel = function () { finish(null); };
            window.addEventListener('focus', onFocusBack, { once: true });
            document.body.appendChild(input);
            input.click();
          });
        },
        reloadApp: function () {
          try {
            window.location.reload();
          } catch (_) {}
        }
      };

      window.HisobchiWebBridge.init();
    })();
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090D18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hisobchi-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 44%, rgba(124, 58, 237, 0.34) 0%, rgba(236, 72, 153, 0.14) 28%, transparent 62%),
        radial-gradient(ellipse at 50% 108%, rgba(124, 58, 237, 0.32) 0%, transparent 56%),
        #090D18;
      color: #F8FAFC;
      transition: opacity 0.25s ease;
    }
    #hisobchi-splash .logo-wrap {
      position: relative;
      width: 116px;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: hbreathe 2.4s ease-in-out infinite;
    }
    #hisobchi-splash .logo-ring {
      position: absolute;
      inset: 0;
      border-radius: 31px;
      background: conic-gradient(from 0deg, #4F46E5, #7C3AED, #EC4899, rgba(124, 58, 237, 0.12), #4F46E5);
      box-shadow: 0 0 32px rgba(124, 58, 237, 0.55);
      animation: hspin 2.4s linear infinite;
    }
    #hisobchi-splash .logo-inner {
      position: relative;
      width: 106px;
      height: 106px;
      border-radius: 27px;
      background: #13192B;
      border: 1.2px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 13px;
      box-sizing: border-box;
    }
    #hisobchi-splash .logo-inner img {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: cover;
    }
    #hisobchi-splash .title {
      margin-top: 22px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #F8FAFC;
    }
    #hisobchi-splash .sub {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #CBD5E1;
    }
    #hisobchi-splash .bar {
      margin-top: 20px;
      width: 152px;
      height: 5px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.22);
      overflow: hidden;
      position: relative;
    }
    #hisobchi-splash .bar-fill {
      width: 64px;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #7C3AED, #EC4899);
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.65);
      animation: hslide 1.3s ease-in-out infinite alternate;
    }
    @keyframes hspin {
      to { transform: rotate(360deg); }
    }
    @keyframes hbreathe {
      0%, 100% { transform: scale(0.97); }
      50% { transform: scale(1.03); }
    }
    @keyframes hslide {
      from { transform: translateX(0); }
      to { transform: translateX(88px); }
    }
  </style>
</head>
<body>
  <div id="hisobchi-splash">
    <div class="logo-wrap">
      <div class="logo-ring"></div>
      <div class="logo-inner">
        <img src="icons/Icon-192.png" alt="Hisobchi">
      </div>
    </div>
    <div class="title">Hisobchi</div>
    <div class="sub">Ilova yuklanmoqda...</div>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('hisobchi-splash');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 250);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
